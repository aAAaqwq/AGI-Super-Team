name: Publish to npm

# Release publication is a deliberate action: this runs only when a version tag
# is pushed, never on ordinary branch pushes. GitHub release creation and npm
# publication are separate steps (see docs/guides/npm-release-status.md), so the
# job re-derives the expected version from the tag and refuses to publish a
# package whose manifest disagrees.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v1.6.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish tagged release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Confirm the tag matches the package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          manifest=$(node -p "require('./package.json').version")
          if [ "$tag" != "v$manifest" ]; then
            echo "Tag '$tag' does not match package.json version '$manifest'." >&2
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt

      # `npm publish` also runs the package's own prepublishOnly gate. Running
      # the contracts here first fails the job with a readable reason instead
      # of surfacing a mid-publish abort.
      - name: Enforce repository contracts
        run: npm run validate:strict

      - name: Publish to the official registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Verify the published version resolves
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.version.outputs.version }}"
          for attempt in 1 2 3 4 5; do
            observed=$(npm view "agi-super-team@$expected" version 2>/dev/null || true)
            if [ "$observed" = "$expected" ]; then
              echo "npm publishes agi-super-team@$expected"
              exit 0
            fi
            sleep 10
          done
          echo "Registry did not resolve agi-super-team@$expected after publication." >&2
          exit 1
